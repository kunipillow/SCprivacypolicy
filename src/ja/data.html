<h1>データについて</h1>

<h2>チャートの作り方</h2>
<p>StratChart のチャートと表は、公開情報から取得した各指数の日々の終値をもとに作成しています。取引日ごとに1日1回、各市場の取引終了後に更新します。</p>

<h2>データの正確さ</h2>
<p>データには誤り・欠落・遅延が含まれる場合があります。無料版のデータは1週間遅れです。</p>

<h2>学習目的のアプリです</h2>
<p>StratChart は学習を目的としたアプリであり、投資助言を行うものではありません。過去の傾向は、将来の結果を保証するものではありません。投資に関する最終的な判断は、ご自身の責任で行ってください。</p>
